name: release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository }}/feed-server

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/feed-server/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.ref_name }}
            ${{ env.IMAGE }}:latest

  # Render deploys are triggered by deploy hooks (secrets). All three jobs are
  # gated on FEED_PUBLIC_URL so the workflow stays green until Render is
  # provisioned (DEPLOY.md). Paired order per plan §2.2: server first, web after.
  deploy-server:
    needs: image
    if: vars.FEED_PUBLIC_URL != ''
    runs-on: ubuntu-latest
    steps:
      # imgURL pins the exact version tag; every other component of the
      # reference must match the image URL configured on the Render service.
      - run: curl -fsS "${{ secrets.RENDER_SERVER_DEPLOY_HOOK }}&imgURL=${{ env.IMAGE }}:${{ github.ref_name }}"

  deploy-web:
    needs: deploy-server
    if: vars.FEED_PUBLIC_URL != ''
    runs-on: ubuntu-latest
    steps:
      # Render builds the static site from the tracked branch tip with
      # VITE_FEED_URL set in the Render dashboard; in trunk-based flow the
      # tag and the branch tip coincide.
      - run: curl -fsS "${{ secrets.RENDER_WEB_DEPLOY_HOOK }}"

  smoke:
    needs: [deploy-server, deploy-web]
    if: vars.FEED_PUBLIC_URL != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      # Hooks return before the deploy lands and a free instance may be
      # cold-starting, so the smoke retries before declaring the release
      # failed (plan §2.2).
      - run: |
          for i in $(seq 1 10); do
            node scripts/smoke.mjs "${{ vars.FEED_PUBLIC_URL }}" "${{ vars.WEB_PUBLIC_URL }}" && exit 0
            echo "smoke attempt $i failed; retrying in 30 s"
            sleep 30
          done
          exit 1
