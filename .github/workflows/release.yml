name: release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository }}/feed-server

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/feed-server/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.ref_name }}
            ${{ env.IMAGE }}:latest

  # Deploy jobs are gated on repo variables so the workflow stays green until
  # Azure is provisioned (see DEPLOY.md). Protocol-bumping releases deploy
  # paired: server first, web immediately after (plan §2.2) — hence `needs`.
  deploy-server:
    needs: image
    if: vars.AZURE_CONTAINERAPP != ''
    runs-on: ubuntu-latest
    steps:
      - uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - run: >
          az containerapp update
          --name ${{ vars.AZURE_CONTAINERAPP }}
          --resource-group ${{ vars.AZURE_RESOURCE_GROUP }}
          --image ${{ env.IMAGE }}:${{ github.ref_name }}

  deploy-web:
    needs: deploy-server
    if: vars.FEED_PUBLIC_URL != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter @fx/web run build
        env:
          VITE_FEED_URL: ${{ vars.FEED_PUBLIC_URL }}

      - uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_SWA_TOKEN }}
          action: upload
          app_location: apps/web/dist
          skip_app_build: true

  smoke:
    needs: [deploy-server, deploy-web]
    if: vars.FEED_PUBLIC_URL != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # A red smoke marks the release failed (plan §2.2).
      - run: node scripts/smoke.mjs ${{ vars.FEED_PUBLIC_URL }} ${{ vars.WEB_PUBLIC_URL }}
