name: ci

on:
  push:
    branches: [master]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # typecheck + boundary lint + unit tests — the same gate every task ends on.
      - run: pnpm verify

      - run: pnpm build

      - run: npx playwright install --with-deps chromium

      # E2E against the local feed-server only — a red run means code broke,
      # never cloud weather (revised ADR-03).
      - run: pnpm test:e2e

      # Thresholds carry shared-runner headroom; honest numbers are measured
      # on the reference machine (plan §4). Ratchet-only.
      - run: pnpm gate:perf
